<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="550"
  viewBox="0 0 900 550"
>
  <style>
    .terminal {
      font-family: "Ubuntu Mono", "Cascadia Mono", "DejaVu Sans Mono", monospace;
      font-size: 18px;
    }

    .user {
      fill: #26a269;
      font-weight: 700;
    }

    .command {
      fill: #12488b;
      font-weight: 700;
    }

    .output {
      fill: #f6f5f4;
    }

    .muted {
      fill: #deddda;
    }
  </style>

  <rect
    width="900"
    height="550"
    rx="10"
    fill="#300a24"
  />

  <!-- Line 1 -->
  <text x="24" y="42" class="terminal">
    <tspan class="user">hai@ubuntu:</tspan>
    <tspan class="command">~$ whoami</tspan>
  </text>

  <!-- Line 2 -->
  <text x="24" y="78" class="terminal output">
    Nguyen Ngoc Hai
  </text>

  <!-- Line 3 -->
  <text x="24" y="114" class="terminal muted">
    Embedded Software enthusiast from Vietnam.
  </text>

  <!-- Line 4 -->
  <text x="24" y="150" class="terminal">
    <tspan class="user">hai@ubuntu:</tspan>
    <tspan class="command">~$ cat about-me.txt</tspan>
  </text>

  <!-- Line 5 -->
  <text x="24" y="186" class="terminal output">
    • Studying at Posts and Telecommunications Institute of Technology — PTIT
  </text>

  <!-- Line 6 -->
  <text x="24" y="222" class="terminal output">
    • Interested in Embedded Software and Firmware Development
  </text>

  <!-- Line 7 -->
  <text x="24" y="258" class="terminal output">
    • Working with STM32, ESP32, Raspberry Pi and BeagleBone
  </text>

  <!-- Line 8 -->
  <text x="24" y="294" class="terminal output">
    • Learning Bare-metal Programming, RTOS and Embedded Linux
  </text>

  <!-- Line 9 -->
  <text x="24" y="330" class="terminal output">
    • Developing embedded projects and improving C/C++ skills
  </text>

  <!-- Line 10 -->
  <text x="24" y="366" class="terminal">
    <tspan class="user">hai@ubuntu:</tspan>
    <tspan class="command">~$ cat technologies.txt</tspan>
  </text>

  <!-- Line 11 -->
  <text x="24" y="402" class="terminal output">
    • Languages: C/C++, Embedded C
  </text>

  <!-- Line 12 -->
  <text x="24" y="438" class="terminal output">
    • MCU/RTOS: STM32F103 (Cortex-M3, Bare-metal), ESP32, FreeRTOS
  </text>

  <!-- Line 13 -->
  <text x="24" y="474" class="terminal output">
    • Protocols: UART, I2C, SPI, TCP/IP, UDP, MQTT, LoRa
  </text>

  <!-- Line 14 -->
  <text x="24" y="510" class="terminal output">
    • IDEs: STM32CubeIDE, Keil Uvision, VS Code
  </text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="780" viewBox="0 0 1040 780" role="img" aria-labelledby="title description">
  <title id="title">Nguyen Ngoc Hai — Embedded Software and Firmware</title>
  <desc id="description">Ubuntu-style terminal with whoami, about-me, technical skills, and a list of embedded software projects.</desc>
  <style>
    .mono { font-family: "Ubuntu Mono", "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 19px; }
    .bold { font-weight: 700; }
    .prompt { fill: #a6e3a1; }
    .path { fill: #89b4fa; }
    .typed { fill: #f5f5f4; }
    .body { fill: #f3f2f1; }
    .secondary { fill: #d9d5dc; }
    .label { fill: #c5bcd0; }
  </style>
  <!-- Self-contained terminal: no remote fonts, images, scripts, or animation. -->
  <rect width="1040" height="780" rx="14" fill="#300a24"/>
  <path d="M14 0 H1026 Q1040 0 1040 14 V48 H0 V14 Q0 0 14 0Z" fill="#241b27"/>
  <path d="M0 48 H1040" stroke="#56445b" stroke-width="1"/>
  <circle cx="28" cy="24" r="8" fill="#e95420"/>
  <circle cx="54" cy="24" r="8" fill="#766978"/>
  <circle cx="80" cy="24" r="8" fill="#766978"/>
  <text x="520" y="31" text-anchor="middle" class="mono secondary" style="font-size:16px">hai@ubuntu: ~</text>
  <g class="mono" xml:space="preserve">
    <text x="36" y="96"><tspan class="prompt bold">hai@ubuntu</tspan><tspan class="secondary">:</tspan><tspan class="path bold">~</tspan><tspan class="secondary">$</tspan><tspan class="typed"> whoami</tspan></text>
    <text x="36" y="128"><tspan class="body bold">Nguyen Ngoc Hai</tspan></text>
    <text x="36" y="160"><tspan class="secondary">Embedded Software / Firmware · Vietnam</tspan></text>
    <text x="36" y="208"><tspan class="prompt bold">hai@ubuntu</tspan><tspan class="secondary">:</tspan><tspan class="path bold">~</tspan><tspan class="secondary">$</tspan><tspan class="typed"> cat about-me.txt</tspan></text>
    <text x="36" y="240"><tspan class="body">• Student at PTIT</tspan></text>
    <text x="36" y="272"><tspan class="body">• Interested in low-level and systems programming</tspan></text>
    <text x="36" y="304"><tspan class="body">• Building embedded firmware and Linux projects</tspan></text>
    <text x="36" y="352"><tspan class="prompt bold">hai@ubuntu</tspan><tspan class="secondary">:</tspan><tspan class="path bold">~</tspan><tspan class="secondary">$</tspan><tspan class="typed"> cat technical-skills.txt</tspan></text>
    <text x="36" y="384"><tspan class="label">Languages</tspan><tspan x="195" class="body">C, C++</tspan></text>
    <text x="36" y="416"><tspan class="label">Platforms</tspan><tspan x="195" class="body">STM32, ESP32, ARM Cortex-M</tspan></text>
    <text x="36" y="448"><tspan class="label">Systems</tspan><tspan x="195" class="body">Bare-metal, RTOS, Embedded Linux</tspan></text>
    <text x="36" y="480"><tspan class="label">Interfaces</tspan><tspan x="195" class="body">UART, SPI, I2C, TCP/IP, UDP</tspan></text>
    <text x="36" y="512"><tspan class="label">Tools</tspan><tspan x="195" class="body">Git, GCC, GDB, OpenOCD, Make/CMake</tspan></text>
    <text x="36" y="560"><tspan class="prompt bold">hai@ubuntu</tspan><tspan class="secondary">:</tspan><tspan class="path bold">~</tspan><tspan class="secondary">$</tspan><tspan class="typed"> ls ~/projects</tspan></text>
    <text x="36" y="592"><tspan class="body">hairtos/</tspan></text>
    <text x="36" y="624"><tspan class="body">secure-delta-ota-bootloader/</tspan></text>
    <text x="36" y="656"><tspan class="body">mini-multimeter/</tspan></text>
    <text x="36" y="688"><tspan class="body">linux-voip-softphone/</tspan></text>
    <text x="36" y="736"><tspan class="prompt bold">hai@ubuntu</tspan><tspan class="secondary">:</tspan><tspan class="path bold">~</tspan><tspan class="secondary">$</tspan></text>
  </g>
  <rect x="195" y="717" width="11" height="23" rx="1" fill="#f3f2f1"/>
</svg>
